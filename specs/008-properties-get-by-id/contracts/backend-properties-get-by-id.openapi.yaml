openapi: 3.1.0
info:
  title: Consulta de propiedad por id
  version: 1.0.0
  description: Contrato público para consultar una propiedad individual.
servers:
  - url: http://localhost:5065
    description: Entorno local
paths:
  /api/properties/{id}:
    get:
      operationId: getPropertyById
      summary: Consultar una propiedad por id
      tags:
        - Properties
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador GUID de la propiedad.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Propiedad encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPropertyByIdResponse'
        '404':
          description: El id no coincide con una propiedad o el segmento no es un GUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: La propiedad contiene una referencia de imagen inconsistente o ocurrió un fallo interno.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    GetPropertyByIdResponse:
      type: object
      required:
        - id
        - title
        - description
        - address
        - price
        - status
        - bedroomCount
        - bathroomCount
        - areaSquareMeters
        - imageUrl
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        address:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
          enum:
            - Available
            - Rented
            - Maintenance
        bedroomCount:
          type: integer
          format: int32
        bathroomCount:
          type: integer
          format: int32
        areaSquareMeters:
          type: number
          format: double
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: URL absoluta pública o null si la propiedad no tiene imagen.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
      additionalProperties: true
